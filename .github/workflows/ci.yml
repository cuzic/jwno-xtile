name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  JANET_VERSION: v1.42.1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Janet (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o janet.tgz "https://github.com/janet-lang/janet/releases/download/${JANET_VERSION}/janet-${JANET_VERSION}-linux-x64.tar.gz"
          mkdir janet && tar -xzf janet.tgz -C janet
          bin="$(dirname "$(find "$PWD/janet" -type f -name janet -path '*/bin/*' | head -1)")"
          echo "janet found in: $bin"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install Janet (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = $env:JANET_VERSION.TrimStart('v')
          Invoke-WebRequest "https://github.com/janet-lang/janet/releases/download/$env:JANET_VERSION/janet-$v-windows-x64-installer.msi" -OutFile janet.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/i', 'janet.msi', '/qn', '/norestart'
          $exe = Get-Item (Join-Path $env:LOCALAPPDATA 'Apps\Janet\bin\janet.exe') -ErrorAction SilentlyContinue
          if (-not $exe) { throw 'janet.exe not found after install' }
          Write-Host "janet found in: $($exe.DirectoryName)"
          $exe.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Janet version
        run: janet -v

      - name: Core + shell tests
        run: janet test/run.janet
